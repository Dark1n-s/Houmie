<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #222e3a);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
        .label {
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">Температура</div>
        <div class="value" id="tempValue">-- °C</div>
    </div>
    <div class="card">
        <div class="label">Вологість</div>
        <div class="value" id="humValue">-- %</div>
    </div>
    <div class="card">
        <div class="label">Вага</div>
        <div class="value" id="weightValue">-- кг</div>
    </div>
    <div class="card">
        <div class="label">Сон</div>
        <div class="value" id="sleepValue">--</div>
    </div>
    <div class="card">
        <div class="label">Відсоток жиру</div>
        <div class="value" id="fatValue">-- %</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        
        document.getElementById('tempValue').innerText = (urlParams.get('temp') || '--') + ' °C';
        document.getElementById('humValue').innerText = (urlParams.get('hum') || '--') + ' %';
        document.getElementById('weightValue').innerText = (urlParams.get('weight') || '--') + ' кг';
        document.getElementById('sleepValue').innerText = urlParams.get('sleep') || '--';
        document.getElementById('fatValue').innerText = urlParams.get('fat') || '-- %';
    </script>
</body>
</html>
